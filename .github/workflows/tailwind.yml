name: Build Tailwind CSS

# 每次有人 push 改動到任何根目錄的 *.html / *.js(含 tailwind.config.js)/ src/input.css(新增頁面也會自動涵蓋),
# 就自動在 GitHub 自己的伺服器上重新編譯出 styles.css,並 commit 回這個 repo。
# 你完全不需要在自己電腦上安裝 Node/npm,也不需要手動執行任何指令。
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - 'src/input.css'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Tailwind CLI
        run: npm install -D tailwindcss@3.4.19

      - name: Build static CSS
        run: npx tailwindcss -i ./src/input.css -o ./styles.css --minify

      - name: Commit built CSS back to the repo
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: auto-build styles.css from Tailwind source"
          file_pattern: styles.css
